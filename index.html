<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buat princesnya akuu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--night:#150b0e;--wine:#3a1620;--rose:#d9a0a6;--blush:#f2d5d0;--gold:#e8cfa8;--cream:#faf0e6}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#4a2030 0,var(--night) 62%) fixed;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;line-height:1.9;overflow-x:hidden}
.script{font-family:'Pinyon Script',cursive;font-weight:400}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#8c2f45;top:-80px;left:-80px}
.o2{width:260px;height:260px;background:#a8643c;bottom:10%;right:-90px;animation-delay:-6s}
.o3{width:220px;height:220px;background:#6b2740;top:45%;left:-60px;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,-60px) scale(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
section{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:0 28px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* gerbang */
#gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;z-index:3}
#gate .script{font-size:clamp(3rem,15vw,4.6rem);color:var(--blush);line-height:1.1;text-shadow:0 0 30px #d9a0a688}
#gate p{font-style:italic;opacity:.8}
#open{margin-top:18px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:12px 38px;font-size:1.15rem;letter-spacing:.12em;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 24px #e8cfa855;transform:scale(1.04)}}
#main{display:none}

/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity 1.2s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding-top:40px;padding-bottom:40px}
.thread{width:100%;max-width:380px;overflow:visible}
.thread path{fill:none;stroke:var(--rose);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1}
.thread.in path{animation:draw 3.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.thread circle{fill:var(--gold)}
.thread text{font-family:'Pinyon Script',cursive;fill:var(--blush);font-size:20px}
.hero .small{letter-spacing:.3em;text-transform:uppercase;font-size:.85rem;opacity:.7}
.hero .script{font-size:clamp(3.4rem,17vw,5.4rem);line-height:1.05;color:var(--blush);text-shadow:0 0 34px #d9a0a666}
.hero .sub{font-style:italic;max-width:420px;opacity:.9}
.count{display:flex;gap:10px;align-items:baseline;justify-content:center;margin-top:22px;color:var(--gold);font-style:italic}
.count b{font-size:2.2rem;font-weight:500;font-style:normal;margin-left:10px}
.hint{margin-top:34px;font-size:.9rem;letter-spacing:.2em;opacity:.55;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* bab */
.chap{position:relative;padding-top:16vh;padding-bottom:6vh}
.num{position:absolute;top:8vh;left:-6px;font-size:9rem;line-height:1;opacity:.07;color:var(--rose);font-style:italic;pointer-events:none}
.chap .lbl{letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;color:var(--gold);opacity:.8}
.chap h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:2.6rem;line-height:1.2;color:var(--blush);margin:4px 0 24px}
.lit{margin-bottom:1.4em}
.lit .w{opacity:.2;transition:opacity .6s,color .6s}
.lit .w.on{opacity:1;color:var(--cream)}

/* foto lengkung */
.pf{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8vh 0}
.arch{width:min(250px,68vw);aspect-ratio:3/4;border-radius:200px 200px 10px 10px;overflow:hidden;box-shadow:0 0 0 7px #e8cfa81c,0 0 0 8px #e8cfa855,0 30px 60px #000b;animation:flo 6s ease-in-out infinite}
.arch img,.arch .ph{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--wine);font-size:.9rem;text-align:center;padding:10px;filter:saturate(.9) sepia(.12)}
@keyframes flo{50%{transform:translateY(-10px)}}
.pf figcaption{font-family:'Pinyon Script',cursive;font-size:1.7rem;color:var(--rose)}

/* surat */
.letter{padding-top:20vh;padding-bottom:6vh;text-align:left}
.letter .script{font-size:2.8rem;color:var(--blush);text-align:center;margin-bottom:30px;line-height:1.2}
.sign{text-align:right;font-family:'Pinyon Script',cursive;font-size:2.2rem;color:var(--rose);margin-top:20px}

/* akhir */
.end{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.big{font-family:'Pinyon Script',cursive;font-size:clamp(3.4rem,18vw,6.4rem);line-height:1.1;color:var(--blush);text-shadow:0 0 40px #d9a0a6aa}
.big span{display:inline-block;opacity:0;transform:translateY(30px) rotate(-6deg)}
.big.in span{animation:pop .8s forwards;animation-delay:calc(var(--i)*.08s)}
@keyframes pop{60%{transform:translateY(-6px) rotate(2deg)}to{opacity:1;transform:none}}
.end p{font-style:italic;opacity:.85}
footer{position:relative;z-index:2;text-align:center;padding:24px 20px 60px;opacity:.5;font-size:.9rem}
#mus{position:fixed;right:16px;bottom:16px;z-index:8;display:none;width:42px;height:42px;border-radius:50%;background:#150b0ecc;border:1px solid var(--gold);color:var(--gold);font-size:1.2rem}
#mus.off{opacity:.45}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}#fx,.orb{display:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<section id="gate">
  <p>Untuk kamu</p>
  <div class="script" id="gNama"></div>
  <p>ada yang ingin kuceritakan</p>
  <button id="open">Buka ♥</button>
</section>

<main id="main">
  <section class="hero">
    <svg class="thread rv" id="thread" viewBox="0 0 360 120" aria-hidden="true">
      <path id="thr" pathLength="1" d="M30 90 C 110 -20, 250 -20, 330 90"/>
      <circle cx="30" cy="90" r="5"/><circle cx="330" cy="90" r="5"/>
      <text x="30" y="115" text-anchor="middle">kamu</text><text x="330" y="115" text-anchor="middle">aku</text>
      <text font-size="16" fill="#d9a0a6" text-anchor="middle" style="font-family:serif;fill:#d9a0a6">♥<animateMotion dur="4.5s" repeatCount="indefinite" begin="1s"><mpath href="#thr"/></animateMotion></text>
    </svg>
    <p class="small rv" id="hi"></p>
    <h1 class="script rv">Lima bulan</h1>
    <p class="sub rv" id="sub"></p>
    <div class="count rv" id="count">
      <b id="cD">0</b><span>hari</span><b id="cH">0</b><span>jam</span><b id="cM">0</b><span>menit</span>
    </div>
    <p class="hint">gulir pelan-pelan ↓</p>
  </section>

  <div id="story"></div>

  <section class="letter">
    <div class="script rv">Surat untukmu</div>
    <div id="surat"></div>
    <div class="sign rv" id="sign"></div>
  </section>

  <section class="end">
    <div class="big" id="big" aria-label="Happy 5 Months"></div>
    <p class="rv" id="akhir"></p>
  </section>
  <footer id="foot"></footer>
</main>

<audio id="bgm" loop></audio>
<button id="mus" aria-label="Musik">♪</button>

<script>
/* ====== EDIT BAGIAN INI SAJA ====== */
const CONFIG = {
  nama: "SAYANGKUUU",
  dari: "Aku",
  mulai: "2026-06-09T00:00:00",
  musik: "you!.mp3",
  foto: ["foto1.jpg","foto2.jpg","foto3.jpg"],
  caption: ["Senyum favorit","Cantiknya kamu","Alasan aku senyum"],
  fotoSetelah: [1,3,5],   // foto ke-1,2,3 muncul setelah bulan ke-1,3,5
  sub: "dan aku masih jatuh cinta padamu, setiap harinya.",
  bulan: [
    ["Awal yang tak disangka","Aku masih ingat bagaimana semuanya dimulai. Bukan dengan sesuatu yang besar, hanya sebuah pesan, sebuah sapaan kecil yang waktu itu kukira biasa saja. Tapi entah kenapa, dari obrolan sederhana itu aku mulai menunggu namamu muncul di layar. Tanggal 9 Juni, aku memberanikan diri bilang bahwa aku ingin berjalan bersamamu, dan kamu bilang iya. Hari itu aku tidak tahu apa-apa soal masa depan. Aku cuma tahu satu hal: aku tidak mau berhenti bercerita padamu."],
    ["Mulai terbiasa","Bulan kedua, kita mulai terbiasa satu sama lain. Aku jadi hafal jam-jam kamu biasa muncul, hafal caramu tertawa, dan hafal bagaimana kamu mengetik panjang-panjang kalau sedang semangat bercerita. Hal-hal kecil yang dulu terasa asing pelan-pelan menjadi rumah. Aku sadar, nyaman itu tidak datang tiba-tiba. Ia dibangun dari hari-hari yang kita lewati bersama, walau hanya lewat layar."],
    ["Belajar mengerti","Bulan ketiga mengajarkan kita bahwa sayang itu bukan hanya tentang hari-hari yang manis. Ada salah paham, ada sunyi yang canggung, ada malam-malam ketika kita sama-sama lelah dan tidak tahu harus berkata apa. Tapi justru di situ aku belajar bahwa bertahan juga bentuk dari cinta. Aku belajar mendengarkan, belajar mengalah, dan belajar bahwa kamu layak diperjuangkan, bahkan di hari-hari yang tidak mudah."],
    ["Yakin","Di bulan keempat, ada satu perasaan yang makin jelas dan tidak bisa kubantah lagi: aku yakin padamu. Bukan karena semuanya sempurna, tapi karena bersamamu hal-hal biasa terasa istimewa. Kabar kecil darimu bisa memperbaiki hariku, dan satu kata 'hati-hati ya' darimu membuatku merasa dijaga dari jauh. Aku mulai membayangkan hal-hal yang dulu tidak berani kubayangkan, dan di setiap bayangan itu, selalu ada kamu."],
    ["Hari ini","Dan sekarang, lima bulan sudah. Aku menulis ini sambil tersenyum, karena rasanya baru kemarin kita saling mengenal, tapi juga seperti sudah mengenalmu seumur hidup. Jarak mungkin masih ada di antara kita, tapi aku tidak pernah merasa jauh darimu. Setiap kali aku memikirkanmu, kamu selalu terasa dekat, sedekat doa yang kubisikkan untukmu setiap malam."]
  ],
  surat: "Untuk kamu, yang sedang membaca ini sambil (semoga) tersenyum.\n\nTerima kasih sudah memilih aku, di antara semua kemungkinan yang ada di dunia ini. Terima kasih sudah sabar menghadapi aku yang kadang keras kepala, kadang lupa, dan kadang terlalu banyak diam. Kamu tidak pernah membuatku merasa kurang, dan itu hal paling berharga yang pernah kuterima.\n\nAku tidak bisa menjanjikan hidup tanpa masalah. Tapi aku bisa berjanji untuk terus ada, terus belajar, dan terus memilihmu, hari ini, besok, dan di hari-hari yang belum kita tahu bentuknya.\n\nSuatu hari nanti, aku ingin jarak ini menjadi cerita yang kita kenang sambil tertawa, duduk berdampingan, tanpa layar di antara kita.\n\nSelamat lima bulan, sayangku. Aku sayang kamu, lebih dari yang bisa kutulis di halaman mana pun.",
  tandaTangan: "Selalu milikmu,",
  teksAkhir: "Happy 5 Months",
  akhir: "Selamat hari jadi, cintaku.",
  footer: "Dibuat dengan sepenuh hati, khusus untukmu"
};
/* ================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const paras = t => t.split(/\n\n+/).map(p => '<p class="lit">' + p.split(' ').map(w => `<span class="w">${esc(w)}</span>`).join(' ') + '</p>').join('');

$('gNama').textContent = CONFIG.nama;
$('hi').textContent = 'Untuk ' + CONFIG.nama;
$('sub').textContent = CONFIG.sub;
$('sign').innerHTML = esc(CONFIG.tandaTangan) + '<br>' + esc(CONFIG.dari);
$('akhir').textContent = CONFIG.akhir;
$('foot').textContent = CONFIG.footer;
$('surat').innerHTML = paras(CONFIG.surat);
$('big').innerHTML = [...CONFIG.teksAkhir].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':esc(c)}</span>`).join('');

$('story').innerHTML = CONFIG.bulan.map((b,i) => {
  const n = i + 1, fi = CONFIG.fotoSetelah.indexOf(n);
  const f = fi > -1 && CONFIG.foto[fi]
    ? `<figure class="pf rv"><div class="arch"><img src="${CONFIG.foto[fi]}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>Taruh ${CONFIG.foto[fi]}</div>'"></div><figcaption>${esc(CONFIG.caption[fi]||'')}</figcaption></figure>` : '';
  return `<section class="chap"><div class="num">${roman[i]}</div><div class="lbl rv">Bulan ${roman[i]}</div><h2 class="rv">${esc(b[0])}</h2>${paras(b[1])}</section>${f}`;
}).join('');

/* ---------- kelopak mawar ---------- */
const fc = $('fx'), fx = fc.getContext('2d');
let W, H, parts = [];
function size(){ W = fc.width = innerWidth; H = fc.height = innerHeight; }
size(); addEventListener('resize', size);
const COLS = ['#d9a0a6','#f2d5d0','#b5545f','#e8cfa8'];
function spawn(x, y, burst){
  const a = Math.random()*6.28, v = 2 + Math.random()*4;
  parts.push({x, y, s:5+Math.random()*8, c:COLS[Math.floor(Math.random()*4)], rot:Math.random()*6, vr:(Math.random()-.5)*.08, t:Math.random()*6,
    vx:burst?Math.cos(a)*v:(Math.random()-.5)*.5, vy:burst?Math.sin(a)*v-2:.6+Math.random()*1.1, g:burst?.07:0, a:.85, fade:burst?.012:0, sway:burst?0:.7});
}
function burst(x, y, n){ for (let i=0;i<n;i++) spawn(x,y,true); }
function shower(){ for (let i=0;i<45;i++) spawn(Math.random()*W, -20-Math.random()*H*.6, false); }
function loop(){
  fx.clearRect(0,0,W,H);
  if (parts.length < 26 && Math.random() < .05) spawn(Math.random()*W, -20, false);
  parts = parts.filter(p => p.a > 0 && p.y < H+30);
  parts.forEach(p => {
    p.t += .02; p.x += p.vx + Math.sin(p.t)*p.sway; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.a -= p.fade;
    fx.save(); fx.translate(p.x,p.y); fx.rotate(p.rot); fx.globalAlpha = Math.max(p.a,0); fx.fillStyle = p.c;
    fx.beginPath(); fx.ellipse(0,0,p.s*.55,p.s,0,0,6.283); fx.fill(); fx.restore();
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 8));

/* ---------- kata menyala saat digulir ---------- */
let tick = false;
function lit(){
  tick = false;
  const vh = innerHeight;
  document.querySelectorAll('.lit').forEach(p => {
    const r = p.getBoundingClientRect();
    const prog = Math.min(1, Math.max(0, (vh*.8 - r.top) / (r.height + vh*.3)));
    const ws = p._w || (p._w = p.querySelectorAll('.w'));
    const k = Math.round(prog * ws.length);
    ws.forEach((s,i) => { const on = i < k; if (on !== s._on){ s._on = on; s.classList.toggle('on', on); } });
  });
}
addEventListener('scroll', () => { if (!tick){ tick = true; requestAnimationFrame(lit); } }, {passive:true});
addEventListener('resize', lit);

/* ---------- muncul perlahan ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target; el.classList.add('in'); io.unobserve(el);
  if (el.id === 'count') countUp();
  if (el.id === 'big'){ burst(innerWidth/2, innerHeight/2, 50); setTimeout(shower, 300); }
}), {threshold:.25});
function watch(){ document.querySelectorAll('.rv,#big').forEach(el => io.observe(el)); }

function countUp(){
  const d = Math.max(0, Date.now() - new Date(CONFIG.mulai).getTime());
  const v = {cD:Math.floor(d/864e5), cH:Math.floor(d/36e5)%24, cM:Math.floor(d/6e4)%60};
  Object.keys(v).forEach(id => {
    const b = $(id), t0 = performance.now();
    (function step(t){ const k = Math.min(1,(t-t0)/2000); b.textContent = Math.round(v[id]*(1-Math.pow(1-k,3))); if (k<1) requestAnimationFrame(step); })(t0);
  });
}

/* ---------- buka + musik ---------- */
const bgm = $('bgm'), mus = $('mus');
$('open').onclick = e => {
  burst(e.clientX, e.clientY, 40);
  $('gate').style.display = 'none'; $('main').style.display = 'block'; scrollTo(0,0);
  watch(); lit(); shower();
  if (CONFIG.musik){
    bgm.src = CONFIG.musik; bgm.play().catch(()=>{});
    mus.style.display = 'block';
  }
};
mus.onclick = () => {
  if (bgm.paused){ bgm.play(); mus.classList.remove('off'); } else { bgm.pause(); mus.classList.add('off'); }
};
</script>
</body>
</html>
