<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buat princesnya akuu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--espresso:#24150e;--mocha:#4a2f21;--caramel:#c68b59;--latte:#e6cfb3;--cream:#f6ead7;--rose:#d9a38a;--wax:#8c2f2a}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% 0,var(--mocha),var(--espresso) 75%) fixed;color:var(--cream);font-family:'Fraunces',Georgia,serif;line-height:1.7;overflow-x:hidden}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
section{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:80px 24px;text-align:center}
.hand{font-family:'Caveat',cursive;color:var(--caramel);font-size:1.7rem}
button{font:inherit;background:var(--caramel);color:var(--espresso);border:0;border-radius:999px;padding:14px 34px;font-weight:600;cursor:pointer}
h2{font-weight:400;font-style:italic;font-size:1.7rem;margin-bottom:34px}
h2::after{content:"";display:block;width:60px;height:1px;background:var(--caramel);margin:14px auto 0}
#gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;z-index:3}
#gate h1{font-weight:600;font-style:italic;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.1;color:var(--latte)}
.cup{position:relative;width:70px;height:60px;margin-bottom:6px}
.cup i{position:absolute;bottom:0;left:6px;width:46px;height:34px;background:var(--latte);border-radius:0 0 22px 22px}
.cup i::after{content:"";position:absolute;right:-14px;top:5px;width:16px;height:16px;border:5px solid var(--latte);border-left:0;border-radius:0 14px 14px 0}
.cup b{position:absolute;bottom:34px;width:3px;height:22px;background:linear-gradient(var(--latte),transparent);border-radius:3px;opacity:0;animation:steam 2.6s ease-in-out infinite}
.cup b:nth-child(1){left:16px}.cup b:nth-child(2){left:27px;animation-delay:.8s}.cup b:nth-child(3){left:38px;animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.6)}40%{opacity:.7}100%{opacity:0;transform:translateY(-18px) translateX(5px) scaleY(1.2)}}
#open{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px #c68b5922}}
#main{display:none}
.rv{opacity:0;transform:translateY(40px) scale(.96);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.heart-svg{width:140px;margin:10px auto 0;display:block;overflow:visible}
.heart-svg path{fill:transparent;stroke:var(--rose);stroke-width:3;stroke-dasharray:300;stroke-dashoffset:300;transform-origin:50% 50%;transform-box:fill-box}
.heart-svg.in path{animation:draw 2.2s ease forwards,fillIn 1s 2s forwards,beat 1.3s 3s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill:var(--rose)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
#typed{min-height:8.5em;font-size:1.2rem;font-style:italic;margin-top:22px;color:var(--latte)}
#typed::after{content:"|";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.count{display:flex;justify-content:center;gap:26px}
.count div{background:#ffffff0d;border:1px solid #c68b5955;border-radius:14px;padding:12px 18px;min-width:84px}
.count b{display:block;font-size:2.3rem;font-weight:600;color:var(--caramel);line-height:1.2}
.count small{opacity:.75}
#tl{position:relative;margin-left:14px;text-align:left}
#tl::before{content:"";position:absolute;left:0;top:0;width:2px;height:var(--h,0%);background:linear-gradient(var(--caramel),var(--rose))}
.item{padding:0 0 30px 26px;position:relative}
.item::before{content:"♥";position:absolute;left:-8px;top:0;color:var(--rose);background:var(--espresso);font-size:14px;line-height:1.4}
.item.in::before{animation:beat 1.3s 2}
.item:nth-child(odd){transform:translateX(-50px)}
.item:nth-child(even){transform:translateX(50px)}
.item strong{color:var(--caramel);font-weight:600}
.pol{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;perspective:900px}
.card{position:relative;width:150px;background:var(--cream);padding:8px;border-radius:3px;box-shadow:0 14px 28px #0009;transform:rotate(var(--r)) translateY(60px) rotateX(40deg);opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .8s}
.card::before{content:"";position:absolute;top:-11px;left:50%;width:58px;height:20px;margin-left:-29px;background:#c68b59bb;transform:rotate(calc(var(--r)*-1.5));box-shadow:0 1px 3px #0004}
.card.in{opacity:1;transform:rotate(var(--r));animation:float 5.5s ease-in-out infinite;animation-delay:var(--d)}
.card:hover{transform:rotate(0) scale(1.12);animation-play-state:paused;z-index:3}
.card img,.card .ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--latte);color:var(--mocha);font-size:.75rem;display:flex;align-items:center;justify-content:center;padding:6px;filter:sepia(.25) saturate(.9)}
.card figcaption{font-family:'Caveat',cursive;color:var(--mocha);font-size:1.25rem;text-align:center;line-height:1.2;margin-top:6px}
@keyframes float{50%{transform:rotate(var(--r)) translateY(-10px)}}
#env{position:relative;width:270px;height:175px;margin:30px auto 0;cursor:pointer}
.eb{position:absolute;inset:0;background:#b98458;border-radius:6px;box-shadow:0 14px 30px #0008}
.flap{position:absolute;left:0;right:0;top:0;height:95px;background:#a8744a;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:4}
.seal{position:absolute;left:50%;top:70px;margin-left:-19px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8453d,var(--wax));color:#f6d9c8;display:flex;align-items:center;justify-content:center;z-index:5;transition:opacity .3s;animation:beat 1.3s infinite;box-shadow:0 2px 6px #0007}
.paper{position:absolute;left:14px;right:14px;top:10px;bottom:10px;background:var(--cream);border-radius:3px;transition:transform 1s .5s;z-index:1}
.front{position:absolute;inset:0;z-index:3;background:#c9955f;clip-path:polygon(0 100%,0 38%,50% 74%,100% 38%,100% 100%);border-radius:6px}
#env.open .flap{transform:rotateX(180deg);z-index:0}
#env.open .seal{opacity:0}
#env.open .paper{transform:translateY(-130px)}
.letter{position:relative;background:var(--cream);color:var(--mocha);border-radius:6px;padding:0 26px;text-align:left;white-space:pre-line;box-shadow:0 20px 50px #000a;margin-top:34px;max-height:0;overflow:hidden;opacity:0;transition:all 1.3s;background-image:repeating-linear-gradient(transparent 0 30px,#c68b5944 30px 31px);line-height:31px}
.letter.show{max-height:760px;opacity:1;padding:26px}
.letter .hand{color:var(--wax);display:block;text-align:right;line-height:1.3;margin-top:10px}
.big{font-family:'Caveat',cursive;font-size:clamp(3rem,16vw,5rem);line-height:1;color:var(--caramel)}
.big span{display:inline-block;opacity:0;transform:translateY(40px) rotate(-8deg)}
.big.in span{animation:pop .7s forwards;animation-delay:calc(var(--i)*.07s)}
@keyframes pop{60%{transform:translateY(-8px) rotate(3deg)}to{opacity:1;transform:none}}
footer{padding:30px;text-align:center;opacity:.55;font-size:.9rem;position:relative;z-index:2}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<section id="gate">
  <div class="cup" aria-hidden="true"><b></b><b></b><b></b><i></i></div>
  <p class="hand" id="gTop"></p>
  <h1>5 bulan<br>sama kamu</h1>
  <button id="open">Ketuk ♥</button>
</section>

<main id="main">
  <section>
    <p class="hand" id="hi"></p>
    <svg class="heart-svg rv" viewBox="0 0 100 90" aria-hidden="true"><path d="M50 84C20 60 6 44 6 28 6 15 16 6 28 6c9 0 17 5 22 13C55 11 63 6 72 6c12 0 22 9 22 22 0 16-14 32-44 56z"/></svg>
    <p id="typed"></p>
    <div class="count rv" id="count">
      <div><b data-k="d">0</b><small>hari</small></div>
      <div><b data-k="h">0</b><small>jam</small></div>
      <div><b data-k="m">0</b><small>menit</small></div>
    </div>
  </section>
  <section>
    <h2 class="rv">Lima bulan kita</h2>
    <div id="tl"></div>
  </section>
  <section>
    <h2 class="rv">Kamu</h2>
    <div class="pol" id="pol"></div>
  </section>
  <section>
    <h2 class="rv">Ada surat buat kamu</h2>
    <p class="rv" style="opacity:.7">ketuk amplopnya</p>
    <div id="env" class="rv" role="button" tabindex="0" aria-label="Buka surat">
      <div class="eb"></div><div class="paper"></div><div class="front"></div>
      <div class="flap"></div><div class="seal">♥</div>
    </div>
    <div class="letter" id="letter"></div>
  </section>
  <section>
    <p class="big" id="big" aria-label="Happy 5 Months"></p>
    <p class="hand rv" id="sign" style="margin-top:20px"></p>
  </section>
  <footer id="foot"></footer>
</main>
<audio id="bgm" loop></audio>

<script>
/* ====== EDIT BAGIAN INI SAJA ====== */
const CONFIG = {
  nama: "SAYANGKUUU",
  dari: "Aku",
  mulai: "2026-06-09T00:00:00",
  musik: "you!.mp3",
  foto: ["foto1.jpg","foto2.jpg","foto3.jpg"],
  caption: ["Senyum favorit","Cantiknya kamu","Alasan aku senyum"],
  pesanAwal: "Lima bulan itu kelihatannya sebentar, tapi rasanya aku udah kenal kamu lama banget. Makasih udah sabar, udah ada, dan udah jadi rumah buat aku pulang.",
  bulan: [
    ["Bulan 1","Awal kita. Canggung, deg-degan, tapi aku tau ini bakal jadi sesuatu."],
    ["Bulan 2","Mulai nyaman. Cerita kecil jadi cerita panjang."],
    ["Bulan 3","Kita belajar saling ngerti, termasuk pas lagi ngambek."],
    ["Bulan 4","Makin yakin kalau kamu orangnya."],
    ["Bulan 5","Sekarang. Dan aku masih pengen lanjut sampai bulan-bulan berikutnya."]
  ],
  surat: "Untuk kamu,\n\nHappy 5 bulan, ya. Terima kasih udah jadi alasan aku senyum tiap hari. Aku nggak janji jadi sempurna, tapi aku janji terus usaha buat kamu.\n\nSemoga bulan-bulan kita berikutnya makin seru trus ya sayangg!.",
  tandaTangan: "Sayangmu",
  teksAkhir: "Happy 5 Months",
  footer: "Dibuat dengan ♥ khusus buat kamu"
};
/* ================================== */

const $ = id => document.getElementById(id);
const esc = s => s.replace(/</g,'&lt;');
$('gTop').textContent = "Untuk " + CONFIG.nama;
$('hi').textContent = "Hai, " + CONFIG.nama;
$('foot').textContent = CONFIG.footer;
$('sign').textContent = CONFIG.tandaTangan + " " + CONFIG.dari;
$('letter').innerHTML = esc(CONFIG.surat) + '<span class="hand">' + esc(CONFIG.tandaTangan) + ' ' + esc(CONFIG.dari) + '</span>';
$('tl').innerHTML = CONFIG.bulan.map(b => `<div class="item rv"><strong>${esc(b[0])}</strong><br>${esc(b[1])}</div>`).join('');
$('pol').innerHTML = CONFIG.foto.map((f,i) =>
  `<figure class="card" style="--r:${(i%2?1:-1)*(3+i*2)}deg;--d:${i*.6}s"><img src="${f}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>Taruh ${f}</div>'"><figcaption>${esc(CONFIG.caption[i]||'')}</figcaption></figure>`).join('');
$('big').innerHTML = [...CONFIG.teksAkhir].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':esc(c)}</span>`).join('');

const dc = $('dust'), dx = dc.getContext('2d');
const fc = $('fx'), fx = fc.getContext('2d');
let W, H;
function size(){ W = dc.width = fc.width = innerWidth; H = dc.height = fc.height = innerHeight; }
size(); addEventListener('resize', size);
const dust = Array.from({length:60}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.8+.5, p:Math.random()*6, s:.00004+Math.random()*.00008}));
let shoot = null, parts = [];
const COLS = ['#d9a38a','#e6cfb3','#c68b59','#f6ead7'];

function heartShape(x, y, s, col, a){
  fx.save(); fx.globalAlpha = a; fx.fillStyle = col; fx.translate(x, y); fx.scale(s/10, s/10);
  fx.beginPath(); fx.moveTo(0,3); fx.bezierCurveTo(-5,-3,-10,2,0,10); fx.bezierCurveTo(10,2,5,-3,0,3); fx.fill(); fx.restore();
}
function burst(x, y, n = 36){
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.28, v = 2 + Math.random()*5;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-2, s:6+Math.random()*10, c:COLS[i%4], l:1, g:.08});
  }
}
function rain(){
  for (let i = 0; i < 40; i++) parts.push({x:Math.random()*W, y:-20-Math.random()*H*.5, vx:(Math.random()-.5)*1.2, vy:1.5+Math.random()*2.5, s:8+Math.random()*12, c:COLS[i%4], l:1, g:0, slow:true});
}
function loop(t){
  dx.clearRect(0,0,W,H);
  dust.forEach(d => { d.y -= d.s*16; if (d.y < 0) d.y = 1; dx.globalAlpha = .15 + .5*Math.abs(Math.sin(t/1100 + d.p)); dx.fillStyle = '#e6cfb3'; dx.beginPath(); dx.arc(d.x*W + Math.sin(t/2000 + d.p)*10, d.y*H, d.r, 0, 6.28); dx.fill(); });
  if (!shoot && Math.random() < .005) shoot = {x:Math.random()*W*.8, y:Math.random()*H*.4, l:1};
  if (shoot){ dx.globalAlpha = shoot.l; dx.strokeStyle = '#e6cfb3'; dx.lineWidth = 2; dx.beginPath(); dx.moveTo(shoot.x, shoot.y); dx.lineTo(shoot.x-70, shoot.y-35); dx.stroke(); shoot.x += 12; shoot.y += 6; shoot.l -= .02; if (shoot.l <= 0) shoot = null; }
  fx.clearRect(0,0,W,H);
  parts = parts.filter(p => p.l > 0 && p.y < H+30);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.l -= p.slow ? .002 : .012; heartShape(p.x, p.y, p.s, p.c, Math.max(p.l,0)); });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 10));

const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target; el.classList.add('in'); io.unobserve(el);
  if (el.id === 'count') countUp();
  if (el.id === 'big') { burst(innerWidth/2, innerHeight/2, 60); setTimeout(rain, 400); }
}), {threshold:.3});
function watch(){ document.querySelectorAll('.rv,.card,#big').forEach(el => io.observe(el)); }

addEventListener('scroll', () => {
  const tl = $('tl'), r = tl.getBoundingClientRect();
  tl.style.setProperty('--h', (Math.min(1, Math.max(0, (innerHeight*.7 - r.top) / r.height))*100) + '%');
}, {passive:true});

function countUp(){
  const d = Math.max(0, Date.now() - new Date(CONFIG.mulai).getTime());
  const v = {d:Math.floor(d/864e5), h:Math.floor(d/36e5)%24, m:Math.floor(d/6e4)%60};
  document.querySelectorAll('#count b').forEach(b => {
    const end = v[b.dataset.k], t0 = performance.now();
    (function step(t){ const k = Math.min(1,(t-t0)/1800); b.textContent = Math.round(end*(1-Math.pow(1-k,3))); if (k<1) requestAnimationFrame(step); })(t0);
  });
}

function typeText(el, text, i = 0){ el.textContent = text.slice(0,i); if (i < text.length) setTimeout(() => typeText(el, text, i+1), 45); }

function openEnv(){
  const env = $('env'); if (env.classList.contains('open')) return;
  env.classList.add('open'); setTimeout(() => $('letter').classList.add('show'), 900);
  const r = env.getBoundingClientRect(); burst(r.left + r.width/2, r.top + 40, 30);
}
$('env').onclick = openEnv;
$('env').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openEnv(); };

$('open').onclick = e => {
  burst(e.clientX, e.clientY, 50);
  $('gate').style.display = 'none'; $('main').style.display = 'block'; scrollTo(0,0);
  watch(); setTimeout(rain, 300);
  setTimeout(() => typeText($('typed'), CONFIG.pesanAwal), 1500);
  if (CONFIG.musik){ const a = $('bgm'); a.src = CONFIG.musik; a.play().catch(()=>{}); }
};
</script>
</body>
</html>
